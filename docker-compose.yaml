services:
  app:
    image: "${SERVICE_IMAGE}"
    restart: unless-stopped
    # Reach PostgreSQL running on the Docker host (not "localhost" inside the container).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount 600+ WAV files from host — excluded from Docker image
      - /opt/ecl/audio_files:/app/wwwroot/AUDIO:ro
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8081
      - ASPNETCORE_ENVIRONMENT=Production
      - WEB_ORIGIN=http://ecl.almutasim.site
      # DB credentials: define DATABASE_URL (and optional AdminCredentials__*) in Coolify → Environment Variables.
      # Do NOT use ${VAR:-} here — Compose substitutes empty defaults and wipes Coolify-injected secrets.
    networks:
      - coolify

networks:
  coolify:
    external: true
