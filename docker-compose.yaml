services:
  app:
    image: "${SERVICE_IMAGE}"
    restart: unless-stopped
    volumes:
      # Mount 600+ WAV files from host — excluded from Docker image
      - /opt/ecl/audio_files:/app/wwwroot/AUDIO:ro
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8081
      - ASPNETCORE_ENVIRONMENT=Production
      # Public URL of the web app for CORS
      - WEB_ORIGIN=${WEB_ORIGIN:-http://ecl.almutasim.site}
    networks:
      - coolify

networks:
  coolify:
    external: true
